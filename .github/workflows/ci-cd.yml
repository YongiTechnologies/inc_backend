# Checks every pull request into dev, and deploys dev to the Hetzner server
# after each merge.
#
# The deploy key lives in the "production" environment, which only dev may use,
# and the server lets it run deploy/hetzner/deploy.sh and nothing else. That
# script deploys both repos, so a merge in either one ships the latest of both.
name: CI/CD

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:   # redeploy by hand from the Actions tab

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: App loads
        run: node -e "require('./src/app')"
      - name: Deploy scripts parse
        run: bash -n deploy/hetzner/*.sh
      - name: Image builds
        run: docker build -t inc-logistics-api:ci .

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://clinetteshipping.com
    concurrency:
      group: hetzner-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to Hetzner
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ServerAliveInterval=30 deploy@2.29.117.211
