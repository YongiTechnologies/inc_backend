# Single-server stack for the I&C / Clinette backend on a Hetzner VPS.
#
#   mongo  — the database. NOT published to the host; only the api container can
#            reach it, over the private "internal" network. Data lives in a named
#            volume that survives rebuilds.
#   api    — the Express app (this repo's Dockerfile), run as a normal long-lived
#            server (node server.js). Reachable only through Caddy.
#   web    — the Next.js frontend (inc_frontend's Dockerfile). Reachable only
#            through Caddy, which also routes the site's /api/* to `api`.
#   caddy  — reverse proxy + automatic HTTPS (Let's Encrypt). The only thing
#            exposed to the internet (ports 80/443).
#
# All configuration comes from deploy/hetzner/.env (copy .env.example to .env).
# Compose reads that same file for ${...} below AND passes it into the api
# container via env_file.
name: inc-logistics

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # The dataset is tiny (~6 MB); cap WiredTiger's cache so Mongo can't grow to
    # ~50% of RAM and crowd out Node/Caddy on a 4 GB box.
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    ulimits:
      nofile: { soft: 64000, hard: 64000 }
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME:-inc_logistics}
      # Consumed by mongo-init.js to create the least-privilege app user.
      APP_DB: ${DB_NAME:-inc_logistics}
      APP_USER: ${MONGO_APP_USER}
      APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Built from parts so the password isn't duplicated. authSource is the app
      # db because mongo-init.js created the user there.
      MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME:-inc_logistics}?authSource=${DB_NAME:-inc_logistics}
      DB_NAME: ${DB_NAME:-inc_logistics}
    depends_on:
      mongo:
        condition: service_healthy
    expose: ["5000"]
    networks: [internal, web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    # The Next.js frontend. Its repo sits next to this one: STAR/inc_frontend on
    # the laptop, /opt/inc_frontend on the server.
    build:
      context: ${FRONTEND_DIR:-../../../inc_frontend}
    restart: unless-stopped
    expose: ["3000"]
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      WEB_ALIASES: ${WEB_ALIASES:-www.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, web]
    networks: [web]

networks:
  internal:   # mongo <-> api only; no internet route needed
  web:        # caddy <-> api, and caddy <-> internet

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
