# Netlify runs the API as functions. No build command: Netlify installs the
# dependencies itself, and there is no static site.
[build]
  # Publish only this tiny folder. Publishing the repo root would put docs,
  # scripts and the spreadsheet fixtures on the public web.
  publish   = "netlify/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Netlify's secrets scan fails the build when a variable marked secret has a
  # value that also appears in the repo. These are plain settings written in
  # the docs and code (inc_logistics, production, the site URLs), not secrets.
  # The real secrets (MONGODB_URI, JWT_*, GOOGLE_CLIENT_SECRET, ...) are still
  # scanned.
  SECRETS_SCAN_OMIT_KEYS = "DB_NAME,NODE_ENV,FRONTEND_URL,GOOGLE_CALLBACK_URL,ALLOWED_ORIGINS,JWT_EXPIRES_IN,GPS_PROVIDER,EMAIL_FROM,CONTACT_EMAIL,GOOGLE_CLIENT_ID"

[functions]
  # swagger-jsdoc reads the route files at runtime for the API docs.
  included_files = ["src/routes/**"]

[functions.cleanup]
  # Daily housekeeping (old audit logs, expired refresh tokens, old GPS pings).
  # Times are UTC; Ghana is UTC+0.
  schedule = "0 2 * * *"

# The function receives the request with "/.netlify/functions/api" stripped
# (serverless-http basePath), so the extra "/api" here keeps Express seeing
# the original /api/... path whichever way Netlify reports it.
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/health"
  to     = "/.netlify/functions/api/health"
  status = 200
  force  = true
